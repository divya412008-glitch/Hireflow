<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HireFlow | Candidates</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .page-header h1 {
            font-size: 30px;
            font-weight: 800;
        }

        .page-header p {
            margin-top: 6px;
            color: var(--muted);
            font-size: 13px;
        }

        .candidate-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .candidate-card {
            position: relative;
            overflow: hidden;

            padding: 22px;
            border-radius: 20px;

            background: var(--card);
            border: 1px solid var(--card-border);

            backdrop-filter: blur(20px);

            transition:
                transform 0.25s ease,
                border 0.25s ease;
        }

        .candidate-card::after {
            content: "";

            position: absolute;

            width: 110px;
            height: 110px;

            right: -50px;
            top: -50px;

            border-radius: 50%;

            background: rgba(139, 92, 246, 0.10);
            filter: blur(10px);
        }

        .candidate-card:hover {
            transform: translateY(-5px);
            border-color: rgba(139, 92, 246, 0.30);
        }

        .candidate-top {
            display: flex;
            align-items: center;
            gap: 13px;

            margin-bottom: 18px;
        }

        .candidate-avatar {
            width: 52px;
            height: 52px;

            display: grid;
            place-items: center;

            border-radius: 15px;

            font-size: 18px;
            font-weight: 800;

            background:
                linear-gradient(
                    135deg,
                    var(--purple),
                    var(--pink)
                );

            box-shadow:
                0 10px 30px rgba(139,92,246,0.22);
        }

        .candidate-card h3 {
            font-size: 15px;
            margin-bottom: 5px;
        }

        .candidate-email {
            color: var(--muted);
            font-size: 10px;
        }

        .candidate-info {
            display: flex;
            flex-direction: column;
            gap: 8px;

            margin-top: 15px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;

            padding: 9px 10px;

            border-radius: 9px;

            background: rgba(255,255,255,0.035);
        }

        .info-row span:first-child {
            color: var(--muted);
            font-size: 10px;
        }

        .info-row span:last-child {
            color: #e3e8f4;
            font-size: 10px;
            font-weight: 600;
            text-align: right;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;

            margin-top: 15px;
        }

        .skill {
            padding: 6px 8px;

            border-radius: 7px;

            color: var(--purple-light);

            background: rgba(139,92,246,0.10);

            font-size: 9px;
            font-weight: 600;
        }

        .candidate-actions {
            display: flex;
            gap: 8px;

            margin-top: 17px;
        }

        .candidate-action {
            flex: 1;

            padding: 9px;

            border-radius: 9px;

            border: 1px solid rgba(255,255,255,0.07);

            background: rgba(255,255,255,0.035);

            color: #cbd3e3;

            font-size: 10px;
            font-weight: 600;

            cursor: pointer;
        }

        .candidate-action:hover {
            background: rgba(139,92,246,0.10);
            color: white;
        }

        @media (max-width: 1100px) {
            .candidate-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 700px) {
            .candidate-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">H</div>

            <div>
                <h2>HireFlow</h2>
                <span>Applicant Tracking</span>
            </div>

        </div>

        <nav>

            <button
                class="nav-item"
                onclick="location.href='index.html'">
                Dashboard
            </button>

            <button
                class="nav-item"
                onclick="location.href='jobs.html'">
                Jobs
            </button>

            <button class="nav-item active">
                Candidates
            </button>

            <button
                class="nav-item"
                onclick="alert('Applications page coming next')">
                Applications
            </button>

            <button
                class="nav-item"
                onclick="alert('Interviews page coming next')">
                Interviews
            </button>

            <button
                class="nav-item"
                onclick="alert('Feedback page coming next')">
                Feedback
            </button>

        </nav>

    </aside>


    <main class="main-content">

        <div class="page-header">

            <div>

                <h1>Candidates</h1>

                <p>
                    Explore applicants and their professional profiles.
                </p>

            </div>

        </div>


        <div id="candidateGrid" class="candidate-grid">

            <p class="loading">
                Loading candidates...
            </p>

        </div>

    </main>

</div>


<script>

async function loadCandidates() {

    const container =
        document.getElementById("candidateGrid");

    try {

        const response =
            await fetch("/api/candidates");

        if (!response.ok) {
            throw new Error("Failed to load candidates");
        }

        const candidates =
            await response.json();

        if (!candidates.length) {

            container.innerHTML = `
                <p class="loading">
                    No candidates available.
                </p>
            `;

            return;
        }

        container.innerHTML = candidates.map(candidate => {

            const initial =
                candidate.name
                    ? candidate.name.charAt(0).toUpperCase()
                    : "?";

            const skills =
                candidate.skills
                    ? candidate.skills
                        .split(",")
                        .map(skill => `
                            <span class="skill">
                                ${skill.trim()}
                            </span>
                        `)
                        .join("")
                    : `
                        <span class="skill">
                            No skills listed
                        </span>
                    `;

            return `
                <div class="candidate-card">

                    <div class="candidate-top">

                        <div class="candidate-avatar">
                            ${initial}
                        </div>

                        <div>

                            <h3>
                                ${candidate.name}
                            </h3>

                            <div class="candidate-email">
                                ${candidate.email}
                            </div>

                        </div>

                    </div>


                    <div class="candidate-info">

                        <div class="info-row">

                            <span>Phone</span>

                            <span>
                                ${candidate.phone || "Not provided"}
                            </span>

                        </div>


                        <div class="info-row">

                            <span>Experience</span>

                            <span>
                                ${candidate.experience || 0} years
                            </span>

                        </div>


                        <div class="info-row">

                            <span>Resume</span>

                            <span>
                                ${candidate.resumeUrl || "Not available"}
                            </span>

                        </div>

                    </div>


                    <div class="skills">
                        ${skills}
                    </div>


                    <div class="candidate-actions">

                        <button
                            class="candidate-action"
                            onclick="alert('Candidate profile selected')">
                            View Profile
                        </button>

                        <button
                            class="candidate-action"
                            onclick="location.href='index.html'">
                            Dashboard
                        </button>

                    </div>

                </div>
            `;

        }).join("");

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <p class="loading">
                Unable to load candidates.
            </p>
        `;
    }
}

loadCandidates();

</script>

</body>

</html>
